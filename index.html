<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Battle Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111c;color:white;font-family:Arial;overflow:hidden;touch-action:none}
canvas{width:100vw;height:100vh;display:block;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}
.badge{background:#07111ccc;border:1px solid #45f6e8;border-radius:10px;padding:8px;font-size:13px;font-weight:bold}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 15px}
#stickArea{width:125px;height:125px;border:2px solid #45f6e8aa;background:#07111c99;border-radius:50%;position:relative;touch-action:none}
#stick{position:absolute;width:50px;height:50px;left:35px;top:35px;background:#45f6e8;border-radius:50%}
.buttons{display:flex;gap:10px;align-items:end}
button{width:70px;height:70px;border-radius:50%;border:2px solid white;background:#ff426ecc;color:white;font-weight:bold;touch-action:none}
#jump{width:55px;height:55px;background:#258effcc}
#overlay{position:fixed;inset:0;background:#030912dd;display:grid;place-items:center;text-align:center;padding:20px}
.card{max-width:380px;background:#102333;border:1px solid #45f6e8;border-radius:20px;padding:25px}
h1{color:#45f6e8}
#start{width:auto;height:auto;border-radius:12px;background:#45f6e8;color:#06151c;padding:14px 25px;font-size:18px}
.hidden{display:none!important}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="badge">❤️ HP: <span id="hp">100</span></div>
 <div class="badge">⭐ KOs: <span id="score">0</span></div>
 <div class="badge">👾 Bots: <span id="bots">0</span></div>
</div>

<div id="controls">
 <div id="stickArea"><div id="stick"></div></div>
 <div class="buttons">
  <button id="jump">JUMP</button>
  <button id="fire">🔥 FIRE</button>
 </div>
</div>

<div id="overlay">
 <div class="card">
  <h1>3D BATTLE ARENA</h1>
  <p>Move with the joystick. Drag the screen to aim. Shoot enemies and survive!</p>
  <button id="start">▶ PLAY NOW</button>
  <p>Mobile browser demo</p>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let player,enemies,bullets,score,hp,running=false,over=false;
let mx=0,my=0,fireHeld=false,angle=0,lastTime=0;

function reset(){
 player={x:0,z:0};
 enemies=[];
 bullets=[];
 score=0;
 hp=100;
 over=false;

 for(let i=0;i<6;i++)spawnEnemy();
 updateHUD();
}

function spawnEnemy(){
 const a=Math.random()*Math.PI*2;
 const r=10+Math.random()*12;
 enemies.push({
  x:player.x+Math.sin(a)*r,
  z:player.z+Math.cos(a)*r,
  speed:0.001+Math.random()*0.0006,
  life:2
 });
}

function updateHUD(){
 document.getElementById("hp").textContent=Math.max(0,hp);
 document.getElementById("score").textContent=score;
 document.getElementById("bots").textContent=enemies.length;
}

function project(x,y,z){
 const dx=x-player.x;
 const dz=z-player.z;
 const s=Math.sin(angle);
 const c=Math.cos(angle);
 const depth=dx*s+dz*c+9;
 const side=dx*c-dz*s;
 const scale=Math.min(W,H)*0.8/Math.max(1,depth);

 return {
  x:W/2+side*scale,
  y:H*0.48+(4-y)*scale,
  scale,
  depth
 };
}

function drawGround(){
 ctx.fillStyle="#1d3836";
 ctx.fillRect(0,H*0.45,W,H*0.55);

 for(let i=-20;i<=20;i+=2){
  let a=project(i,0,-25);
  let b=project(i,0,25);

  ctx.strokeStyle="#4d8c7b55";
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();

  a=project(-25,0,i);
  b=project(25,0,i);

  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
 }
}

function drawPlayer(){
 const p=project(player.x,0,player.z);
 const s=p.scale;

 ctx.fillStyle="#45f6e8";
 ctx.fillRect(p.x-s*.25,p.y-s*1.3,s*.5,s*1.2);

 ctx.fillStyle="#eaffff";
 ctx.beginPath();
 ctx.arc(p.x,p.y-s*1.5,s*.22,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#15202a";
 ctx.fillRect(p.x-s*.08,p.y-s*.9,s*.16,s*.3);
}

function drawEnemy(e){
 const p=project(e.x,0,e.z);
 if(p.depth<1)return;

 const s=p.scale;

 ctx.fillStyle="#ff365e";
 ctx.fillRect(p.x-s*.24,p.y-s*1.1,s*.48,s*.95);

 ctx.fillStyle="#ffc2ce";
 ctx.beginPath();
 ctx.arc(p.x,p.y-s*1.3,s*.22,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#ffffff";
 ctx.fillRect(p.x-s*.13,p.y-s*1.35,s*.07,s*.06);
 ctx.fillRect(p.x+s*.06,p.y-s*1.35,s*.07,s*.06);
}

function drawBullet(b){
 const p=project(b.x,0.7,b.z);
 ctx.fillStyle="#ffe66d";
 ctx.beginPath();
 ctx.arc(p.x,p.y,Math.max(2,p.scale*.1),0,Math.PI*2);
 ctx.fill();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#091426");
 sky.addColorStop(.55,"#315363");
 sky.addColorStop(1,"#152b2a");

 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H);

 // Distant buildings
 for(let i=0;i<12;i++){
  const x=i*W/10;
  const height=35+(i*31%90);
  ctx.fillStyle="#172c3c";
  ctx.fillRect(x,H*.46-height,45,height);
 }

 drawGround();

 // Objects farther away are drawn first.
 const objects=[];
 enemies.forEach(e=>{
  objects.push({
   depth:(e.x-player.x)*Math.sin(angle)+(e.z-player.z)*Math.cos(angle),
   draw:()=>drawEnemy(e)
  });
 });

 objects.sort((a,b)=>b.depth-a.depth);
 objects.forEach(o=>o.draw());

 bullets.forEach(drawBullet);
 drawPlayer();

 // Aim crosshair
 ctx.strokeStyle="#ffffff";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(W/2,H*.43,9,0,Math.PI*2);
 ctx.stroke();
}

function shoot(){
 if(!running||over)return;

 bullets.push({
  x:player.x,
  z:player.z,
  vx:Math.sin(angle)*0.035,
  vz:Math.cos(angle)*0.035,
  life:70
 });
}

function update(dt){
 if(!running||over)return;

 const s=Math.sin(angle);
 const c=Math.cos(angle);

 player.x+=(mx*c+my*s)*dt*.006;
 player.z+=(-mx*s+my*c)*dt*.006;

 if(Math.random()<0.003 && enemies.length<12)spawnEnemy();

 enemies.forEach(e=>{
  const dx=player.x-e.x;
  const dz=player.z-e.z;
  const d=Math.hypot(dx,dz)||1;

  if(d>1.1){
   e.x+=dx/d*e.speed*dt;
   e.z+=dz/d*e.speed*dt;
  }else if(!e.cooldown){
   hp-=10;
   e.cooldown=true;
   setTimeout(()=>e.cooldown=false,700);
  }
 });

 bullets=bullets.filter(b=>{
  b.x+=b.vx*dt;
  b.z+=b.vz*dt;
  b.life--;

  for(let i=enemies.length-1;i>=0;i--){
   const e=enemies[i];

   if(Math.hypot(b.x-e.x,b.z-e.z)<1){
    e.life--;

    if(e.life<=0){
     enemies.splice(i,1);
     score++;
    }
    return false;
   }
  }

  return b.life>0;
 });

 if(hp<=0){
  hp=0;
  over=true;
  running=false;
  document.querySelector(".card h1").textContent="GAME OVER";
  document.querySelector(".card p").textContent="Final KOs: "+score;
  document.getElementById("start").textContent="PLAY AGAIN";
  document.getElementById("overlay").classList.remove("hidden");
 }

 updateHUD();
}

function loop(t){
 const dt=Math.min(40,t-(lastTime||t));
 lastTime=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

// Mobile joystick
const area=document.getElementById("stickArea");
const knob=document.getElementById("stick");
let pointer=null,cx=0,cy=0;

area.addEventListener("pointerdown",e=>{
 e.preventDefault();
 pointer=e.pointerId;
 area.setPointerCapture(pointer);
 const r=area.getBoundingClientRect();
 cx=r.left+r.width/2;
 cy=r.top+r.height/2;
 moveStick(e);
});

function moveStick(e){
 if(e.pointerId!==pointer)return;

 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 const len=Math.hypot(dx,dy);
 const max=38;

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 knob.style.left=(37+dx)+"px";
 knob.style.top=(37+dy)+"px";

 mx=dx/max;
 my=dy/max;
}

area.addEventListener("pointermove",moveStick);

function stopStick(e){
 if(e.pointerId!==pointer)return;
 pointer=null;
 mx=my=0;
 knob.style.left="35px";
 knob.style.top="35px";
}

area.addEventListener("pointerup",stopStick);
area.addEventListener("pointercancel",stopStick);

// Drag the arena to aim
let aiming=false,lastX=0;

canvas.addEventListener("pointerdown",e=>{
 if(e.clientY>H-155)return;
 aiming=true;
 lastX=e.clientX;
});

canvas.addEventListener("pointermove",e=>{
 if(!aiming)return;
 angle+=(e.clientX-lastX)*0.008;
 lastX=e.clientX;
});

canvas.addEventListener("pointerup",()=>aiming=false);
canvas.addEventListener("pointercancel",()=>aiming=false);

// Fire button
const fire=document.getElementById("fire");

fire.addEventListener("pointerdown",e=>{
 e.preventDefault();
 fireHeld=true;
 shoot();
});

["pointerup","pointercancel","pointerleave"].forEach(type=>{
 fire.addEventListener(type,()=>fireHeld=false);
});

setInterval(()=>{if(fireHeld)shoot()},250);

document.getElementById("jump").addEventListener("pointerdown",()=>{
 // Small dodge effect: quickly move forward.
 player.x+=Math.sin(angle)*1.2;
 player.z+=Math.cos(angle)*1.2;
});

document.getElementById("start").addEventListener("click",()=>{
 reset();
 running=true;
 document.getElementById("overlay").classList.add("hidden");
 document.querySelector(".card h1").textContent="3D BATTLE ARENA";
});

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
